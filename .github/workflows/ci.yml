name: PHP CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: codeigniter4-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    name: PHP 8.2 / CodeIgniter 4.3.8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          tools: composer
          extensions: pcntl

      - name: Pin CodeIgniter 4.3
        run: composer require --no-update codeigniter4/framework:^4.3.8

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: composer run phpstan

      - name: Run PHPUnit
        run: composer run test -- --coverage-text

  upper-bound:
    name: PHP ${{ matrix.php }} / CodeIgniter 4.7
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: pcntl

      - name: Pin CodeIgniter 4.7
        run: composer require --no-update codeigniter4/framework:^4.7

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: composer run phpstan

      - name: Run PHPUnit
        run: composer run test -- --no-coverage --do-not-fail-on-risky
